<!DOCTYPE html>
<html lang="en-NZ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>Page Not Found | TopRated NZ</title>
    <meta name="description" content="The requested TopRated NZ page could not be found. Browse New Zealand cities and categories to continue.">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .not-found {
            min-height: 70vh;
            display: grid;
            place-items: center;
            padding: 4rem 1.5rem;
            text-align: center;
        }

        .not-found__card {
            width: min(680px, 100%);
            padding: 3rem;
            border: 1px solid rgba(15, 118, 110, 0.18);
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.1);
        }

        .not-found__code {
            margin: 0 0 0.5rem;
            color: #0f766e;
            font-size: clamp(3rem, 10vw, 6rem);
            line-height: 1;
        }

        .not-found__actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.75rem;
            margin-top: 2rem;
        }

        .not-found__actions a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0.75rem 1.25rem;
            border-radius: 999px;
            color: #fff;
            background: #0f766e;
            text-decoration: none;
            font-weight: 700;
        }

        .not-found__actions a:last-child {
            color: #0f766e;
            background: #f0fdfa;
        }
    </style>
</head>
<body>
    <main class="not-found">
        <section class="not-found__card" aria-labelledby="not-found-title">
            <p class="not-found__code" aria-hidden="true">404</p>
            <h1 id="not-found-title">This page could not be found</h1>
            <p>The address may be incorrect, or the page may have been removed. Continue by browsing TopRated NZ cities and categories.</p>
            <nav class="not-found__actions" aria-label="Page not found options">
                <a href="/cities">Browse cities</a>
                <a href="/">Return home</a>
            </nav>
        </section>
    </main>
</body>
</html>
